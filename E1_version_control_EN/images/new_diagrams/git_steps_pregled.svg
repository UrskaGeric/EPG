<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<defs>
<marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#D62728"/></marker>
<marker id="ms" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C4C4C4"/></marker>
<marker id="mc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker>
</defs>
<rect width="1000" height="650" fill="white"/>
<rect x="12" y="12" width="726" height="626" rx="12" fill="#F5F7FB" stroke="#C9CED8"/>
<text x="375" y="38" text-anchor="middle" font-size="15" font-weight="600" fill="#333">Your computer (local)</text>
<rect x="758" y="12" width="230" height="626" rx="12" fill="#F3F3F6" stroke="#C9CED8"/>
<text x="873" y="38" text-anchor="middle" font-size="15" font-weight="600" fill="#333">Online (remote)</text>
<rect x="22" y="48" width="356" height="550" rx="10" fill="#EAF1FA" stroke="#4C78A8" stroke-opacity="0.45"/>
<rect x="378" y="48" width="164" height="550" rx="10" fill="#FEF2E6" stroke="#E07B1A" stroke-opacity="0.45"/>
<rect x="548" y="48" width="184" height="550" rx="10" fill="#ECF7E9" stroke="#3E8E3E" stroke-opacity="0.45"/>
<rect x="771" y="48" width="218" height="550" rx="10" fill="#EEEEF3" stroke="#5B5B7A" stroke-opacity="0.45"/>
<rect x="398" y="126" width="124" height="462" rx="6" fill="white" stroke="#D5D9E0"/>
<rect x="578" y="126" width="124" height="462" rx="6" fill="white" stroke="#D5D9E0"/>
<rect x="818" y="126" width="124" height="462" rx="6" fill="white" stroke="#D5D9E0"/>
<rect x="33" y="128" width="104" height="460" rx="6" fill="white" stroke="#4C78A8" stroke-opacity="0.5" stroke-dasharray="4 3"/>
<rect x="148" y="128" width="104" height="460" rx="6" fill="white" stroke="#4C78A8" stroke-opacity="0.5" stroke-dasharray="4 3"/>
<rect x="263" y="128" width="104" height="460" rx="6" fill="white" stroke="#4C78A8" stroke-opacity="0.5" stroke-dasharray="4 3"/>
<rect x="30" y="54" width="340" height="62" rx="8" fill="#DCE9F7" stroke="#4C78A8" stroke-width="2"/>
<text x="200.0" y="90" text-anchor="middle" font-size="15" font-weight="700" fill="#222">Working directory</text>
<rect x="382" y="54" width="156" height="62" rx="8" fill="#FDE6CF" stroke="#E07B1A" stroke-width="2"/>
<text x="460.0" y="90" text-anchor="middle" font-size="15" font-weight="700" fill="#222">Staging area</text>
<rect x="552" y="54" width="176" height="62" rx="8" fill="#DDF0D8" stroke="#3E8E3E" stroke-width="2"/>
<text x="640.0" y="80" text-anchor="middle" font-size="15" font-weight="700" fill="#222">Local repository</text>
<text x="640.0" y="101" text-anchor="middle" font-size="12" fill="#555">(.git)</text>
<rect x="775" y="54" width="210" height="62" rx="8" fill="#E6E6EC" stroke="#5B5B7A" stroke-width="2"/>
<text x="880.0" y="80" text-anchor="middle" font-size="15" font-weight="700" fill="#222">Remote repository</text>
<text x="880.0" y="101" text-anchor="middle" font-size="12" fill="#555">(GitHub)</text>
<text x="85" y="155" text-anchor="middle" font-size="12.5" font-weight="600" fill="#2b4f7a">untracked</text>
<text x="200" y="155" text-anchor="middle" font-size="12.5" font-weight="600" fill="#2b4f7a">unmodified</text>
<text x="315" y="155" text-anchor="middle" font-size="12.5" font-weight="600" fill="#2b4f7a">modified</text>
<text x="280" y="618" text-anchor="middle" font-size="14" font-weight="700" font-family="Consolas, monospace" fill="#333333">git status<tspan font-family="Segoe UI, Helvetica, Arial, sans-serif" font-weight="400" font-size="12" fill="#888"> : shows the state of your files (changes nothing)</tspan></text>
<circle cx="880" cy="215" r="6" fill="#333333"/>
<line x1="880" y1="215" x2="204" y2="215" stroke="#333333" stroke-width="3" stroke-dasharray="10 6" marker-end="url(#mc)"/>
<text x="540.0" y="206" text-anchor="middle" font-size="14" font-weight="700" font-family="Consolas, monospace" stroke="white" stroke-width="4" paint-order="stroke" fill="#222">git clone</text>
<text x="540.0" y="234" text-anchor="middle" font-size="12" stroke="white" stroke-width="4" paint-order="stroke" fill="#666">first copy of the whole repository</text>
<circle cx="85" cy="268" r="6" fill="#333333"/>
<line x1="85" y1="268" x2="456" y2="268" stroke="#333333" stroke-width="3" marker-end="url(#mc)"/>
<text x="272.5" y="259" text-anchor="middle" font-size="14" font-weight="700" font-family="Consolas, monospace" stroke="white" stroke-width="4" paint-order="stroke" fill="#222">git add</text>
<text x="272.5" y="287" text-anchor="middle" font-size="12" stroke="white" stroke-width="4" paint-order="stroke" fill="#666">new file: Git starts tracking it</text>
<circle cx="200" cy="321" r="6" fill="#333333"/>
<line x1="200" y1="321" x2="311" y2="321" stroke="#333333" stroke-width="3" marker-end="url(#mc)"/>
<text x="257.5" y="311" text-anchor="middle" font-size="12" stroke="white" stroke-width="4" paint-order="stroke" fill="#666" font-style="italic">you edit in RStudio</text>
<circle cx="315" cy="374" r="6" fill="#333333"/>
<line x1="315" y1="374" x2="456" y2="374" stroke="#333333" stroke-width="3" marker-end="url(#mc)"/>
<text x="387.5" y="365" text-anchor="middle" font-size="14" font-weight="700" font-family="Consolas, monospace" stroke="white" stroke-width="4" paint-order="stroke" fill="#222">git add</text>
<text x="387.5" y="393" text-anchor="middle" font-size="12" stroke="white" stroke-width="4" paint-order="stroke" fill="#666">you choose the changes</text>
<circle cx="460" cy="427" r="6" fill="#333333"/>
<line x1="460" y1="427" x2="636" y2="427" stroke="#333333" stroke-width="3" marker-end="url(#mc)"/>
<text x="550.0" y="418" text-anchor="middle" font-size="14" font-weight="700" font-family="Consolas, monospace" stroke="white" stroke-width="4" paint-order="stroke" fill="#222">git commit</text>
<text x="550.0" y="446" text-anchor="middle" font-size="12" stroke="white" stroke-width="4" paint-order="stroke" fill="#666">save a snapshot (files are unmodified again)</text>
<circle cx="640" cy="480" r="6" fill="#333333"/>
<line x1="640" y1="480" x2="876" y2="480" stroke="#333333" stroke-width="3" stroke-dasharray="10 6" marker-end="url(#mc)"/>
<text x="760.0" y="471" text-anchor="middle" font-size="14" font-weight="700" font-family="Consolas, monospace" stroke="white" stroke-width="4" paint-order="stroke" fill="#222">git push</text>
<text x="760.0" y="499" text-anchor="middle" font-size="12" stroke="white" stroke-width="4" paint-order="stroke" fill="#666">send commits to GitHub</text>
<circle cx="880" cy="533" r="6" fill="#333333"/>
<line x1="880" y1="533" x2="204" y2="533" stroke="#333333" stroke-width="3" stroke-dasharray="10 6" marker-end="url(#mc)"/>
<text x="540.0" y="524" text-anchor="middle" font-size="14" font-weight="700" font-family="Consolas, monospace" stroke="white" stroke-width="4" paint-order="stroke" fill="#222">git pull</text>
<text x="540.0" y="552" text-anchor="middle" font-size="12" stroke="white" stroke-width="4" paint-order="stroke" fill="#666">bring new commits from GitHub (into the repository and working directory)</text>
</svg>